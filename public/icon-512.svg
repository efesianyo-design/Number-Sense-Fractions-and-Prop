  <rect x="260" y="238" width="86" height="48" rx="6" fill="#a855f7" />
  <text x="303" y="270" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1/4</text>
  <rect x="352" y="238" width="84" height="48" rx="6" fill="#a855f7" />
  <text x="394" y="270" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1/4</text>

  <!-- Circle pizza & ratio mark -->
  <circle cx="160" cy="380" r="60" fill="none" stroke="#f59e0b" stroke-width="14" stroke-dasharray="94.2 94.2" />
  <line x1="256" y1="330" x2="256" y2="430" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <text x="350" y="375" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#22c55e">a/b = c/d</text>
